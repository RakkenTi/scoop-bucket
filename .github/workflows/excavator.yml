# Checks the upstream mdre releases every 4 hours and opens a pull request
# bumping the manifests (version + hash) when a new tag is found.
# Modeled on the Excavator workflow used by ScoopInstaller/Main.
name: Excavator

on:
  schedule:
    - cron: '20 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  excavate:
    name: Excavate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Excavate
        uses: ScoopInstaller/GithubActions@main
        env:
          SKIP_UPDATED: 1
